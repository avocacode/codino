version: '3.8'

services:
  # Service untuk Aplikasi PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codino_app
    restart: always
    volumes:
      - .:/var/www/html
    networks:
      - codino_network

  # Service untuk Web Server (Nginx) agar port 8010 bisa diakses
  webserver:
    image: nginx:alpine
    container_name: codino_webserver
    restart: always
    ports:
      - "8010:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - codino_network
    depends_on:
      - app

  # Service untuk Database MySQL
  db:
    image: mysql:8.0
    container_name: codino_db
    restart: always
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: codino_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: codino_user
      MYSQL_PASSWORD: userpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - codino_network

networks:
  codino_network:
    driver: bridge

volumes:
  mysql_data: