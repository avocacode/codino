services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codino_app
    restart: unless-stopped

    ports:
      - "8010:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - db

    networks:
      - codino_network

  db:
    image: mysql:8.0
    container_name: codino_db
    restart: unless-stopped

    ports:
      - "3310:3306"

    environment:
      MYSQL_DATABASE: codino_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: codino_user
      MYSQL_PASSWORD: userpassword

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - codino_network

networks:
  codino_network:
    driver: bridge

volumes:
  mysql_data: